[package]
name = "keeta-trezor"
version = "0.1.0"
edition = "2021"
description = "Sign Keeta block hashes with a Trezor Safe 3 (SLIP-0013 P-256 identity key)"
license = "MPL-2.0"
publish = false

[dependencies]
trezor-client = { version = "=0.1.6", default-features = false }
keetanetwork-account = "=0.4.0"
sha3 = "=0.10.9"
sha2 = "=0.10.9"
hex = "=0.4.3"
clap = { version = "=4.6.6", features = ["derive"] }
thiserror = "=2.0.20"

[dev-dependencies]
p256 = { version = "=0.13.2", features = ["ecdsa"] }
keetanetwork-crypto = "=0.3.0"
